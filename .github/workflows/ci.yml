# Lint and the test suite on every PR and every push to main. The live smoke test and the
# eval need a real model, so they stay local (make test-live, make eval-local).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails the run when uv.lock is out of date with pyproject.toml.
      # The Python version comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test
